<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="title" content="Happy Birthday Aman" />
  <title>HBD 2.0</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    .gesture-catcher {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: transparent;
    }
    .gesture-catcher.hide {
      display: none;
    }
  </style>
</head>
<body>
  <div id="wrapper">

    <!-- TOP FLAGS -->
    <div class="flag__birthday">
      <img src="./images/1.png" width="350" class="flag__left">
      <img src="./images/1.png" width="350" class="flag__right">
    </div>

    <div class="content">
      <div class="left">
        <div class="title">
          <h1 class="happy">
            <span style="--t:4s;">H</span>
            <span style="--t:4.2s;">a</span>
            <span style="--t:4.4s;">p</span>
            <span style="--t:4.6s;">p</span>
            <span style="--t:4.8s;">y</span>
          </h1>

          <h1 class="birthday">
            <span style="--t:5s;">B</span>
            <span style="--t:5.2s;">i</span>
            <span style="--t:5.4s;">r</span>
            <span style="--t:5.6s;">t</span>
            <span style="--t:5.8s;">h</span>
            <span style="--t:6s;">d</span>
            <span style="--t:6.2s;">a</span>
            <span style="--t:6.4s;">y</span>
          </h1>

          <div class="hat"><img src="./images/hat.png" width="130"></div>
        </div>

        <div class="date__of__birth"><span></span></div>

        <div class="btn">
          <button id="btn__letter">Click here Aman <i class="fa-regular fa-envelope"></i></button>
        </div>
      </div>

      <div class="right">
        <div class="box__account">
          <div class="image"><img src="./images/Aman1.PNG"></div>
          <div class="name"><i class="fa-solid fa-heart"></i> <span>Aman</span> <i class="fa-solid fa-heart"></i></div>
          <div class="balloon_one"><img width="100" src="./images/balloon1.png"></div>
          <div class="balloon_two"><img width="100" src="./images/balloon2.png"></div>
        </div>

        <div class="cricle">
          <div class="text__cricle">
            <span style="--i:1;">h</span><span style="--i:2;">a</span><span style="--i:3;">p</span>
            <span style="--i:4;">p</span><span style="--i:5;">y</span><span style="--i:6;">-</span>
            <span style="--i:7;">b</span><span style="--i:8;">i</span><span style="--i:9;">r</span>
            <span style="--i:10;">t</span><span style="--i:11;">h</span><span style="--i:12;">d</span>
            <span style="--i:13;">a</span><span style="--i:14;">y</span><span style="--i:15;">-</span>
          </div>
          <i class="fa-solid fa-heart"></i>
        </div>
      </div>
    </div>

    <!-- MUSIC -->
    <audio id="bgMusic" src="hbd.mp3" preload="auto" loop></audio>

    <!-- MUSIC CONTROL BUTTON -->
    <div id="musicControl" 
      style="position: fixed; top: 15px; right: 15px; z-index: 99999; 
      background:#fff; padding:10px 12px; border-radius:50px; 
      box-shadow:0 0 10px rgba(0,0,0,0.2); cursor:pointer;">
      <i id="musicIcon" class="fa-solid fa-pause"></i>
    </div>

    <!-- GESTURE CATCHER -->
    <div id="gestureCatcher" class="gesture-catcher"></div>

    <!-- LETTER POPUP -->
    <div class="box__letter">
      <div class="letter__border">
        <div class="letter">
          <div class="title__letter"></div>
          <div class="content__letter">
            <div class="left">
              <img id="heart__letter" src="https://media.giphy.com/media/YKUvclrGYmDKXwtphf/giphy.gif">
              <img class="heart heart_1" style="--t:0.2s" width="20" src="./images/heart.png">
              <img class="heart heart_2" style="--t:0.4s" width="20" src="./images/heart.png">
              <img class="heart heart_3" style="--t:0.6s" width="20" src="./images/heart.png">
              <img class="heart heart_4" style="--t:0.8s" width="20" src="./images/heart.png">
            </div>

            <div class="right">
              <div class="love__img"><img src="https://media.giphy.com/media/m85llaN7ZkFIHtURiC/giphy.gif" width="220"></div>
              <div class="text__letter"><p></p></div>
              <img id="mewmew" width="80" src="./images/mewmew.gif">
            </div>
          </div>
        </div>
        <div class="close"><i class="fa-solid fa-xmark"></i></div>
      </div>
    </div>

  </div>

  <!-- MUSIC SCRIPT -->
  <script>
    const audio = document.getElementById("bgMusic");
    const catcher = document.getElementById("gestureCatcher");
    const musicControl = document.getElementById("musicControl");
    const musicIcon = document.getElementById("musicIcon");

    // PC: Try autoplay immediately
    window.addEventListener("load", () => {
      audio.play().catch(() => {
        console.log("Autoplay blocked, waiting first gesture...");
      });
    });

    // Mobile unlock: ANY interaction (scroll, touch, click) plays music
    function unlockAudio() {
      audio.play().then(() => {
        catcher.classList.add("hide");
      }).catch(err => console.log(err));
    }

    ["click", "touchstart", "scroll", "pointerdown"].forEach(evt => {
      window.addEventListener(evt, unlockAudio, { once: true });
      catcher.addEventListener(evt, unlockAudio, { once: true });
    });

    // Play/Pause Toggle
    let isPlaying = true;

    musicControl.addEventListener("click", () => {
      if (isPlaying) {
        audio.pause();
        musicIcon.className = "fa-solid fa-play";
        isPlaying = false;
      } else {
        audio.play();
        musicIcon.className = "fa-solid fa-pause";
        isPlaying = true;
      }
    });
  </script>

  <!-- LETTER SCRIPT -->
  <script>
    let datetxt = "04 August 2006";
    let datatxtletter = 
    "Happy Birthday Aman ❤️. No matter where life takes us, you'll always have a special place in my heart. Thank you for every smile, every memory, and for always being there. I pray Allah blesses you with endless happiness, good health, success, and a life full of peace.You deserve nothing but the best. Happy Birthday once again Laindi.🎂🌸";

    let titleLetter = "To you";

    let charArrDate = datetxt.split('');
    let charArrDateLetter = datatxtletter.split('');
    let charArrTitle = titleLetter.split('');
    let currentIndex = 0, currentIndexLetter = 0, currentIndexTitle = 0;

    let date__of__birth = document.querySelector('.date__of__birth span');
    let text__letter = document.querySelector('.text__letter p');

    setTimeout(function(){
      timeDatetxt = setInterval(function(){
        if(currentIndex < charArrDate.length){
          date__of__birth.textContent += charArrDate[currentIndex];
          currentIndex++;
        } else {
          let i = document.createElement('i');
          i.className = 'fa-solid fa-star';
          document.querySelector('.date__of__birth').prepend(i);
          document.querySelector('.date__of__birth').appendChild(i.cloneNode(true));
          clearInterval(timeDatetxt);
        }
      },100);
    },12000);

    var intervalContent, intervalTitle;

    $('#btn__letter').on('click', function(){
      $('.box__letter').slideDown();
      setTimeout(()=>{$('.letter__border').slideDown();},1000);

      setTimeout(function(){
        intervalTitle = setInterval(function(){
          if(currentIndexTitle < charArrTitle.length){
            document.querySelector('.title__letter').textContent += charArrTitle[currentIndexTitle];
            let i = document.createElement('i');
            i.className = 'fa-solid fa-heart';
            document.querySelector('.title__letter').appendChild(i);
            currentIndexTitle++;
          } else { clearInterval(intervalTitle); }
        },100);
      },2000);

      setTimeout(()=>document.querySelector('#heart__letter').classList.add('animationOp'),2800);
      setTimeout(()=>document.querySelector('.love__img').classList.add('animationOp'),2800);
      setTimeout(()=>document.querySelector('#mewmew').classList.add('animationOp'),2800);

      setTimeout(()=>document.querySelectorAll('.heart').forEach(h=>h.classList.add('animation')),3500);

      setTimeout(function(){
        intervalContent = setInterval(function(){
          if(currentIndexLetter < charArrDateLetter.length){
            text__letter.textContent += charArrDateLetter[currentIndexLetter];
            currentIndexLetter++;
          } else { clearInterval(intervalContent); }
        },50);
      },6000);
    });

    $('.close').on('click', function(){
      clearInterval(intervalContent);
      document.querySelector('.title__letter').textContent = '';
      text__letter.textContent = '';
      currentIndexLetter = 0; currentIndexTitle = 0;
      document.querySelector('#heart__letter').classList.remove('animationOp');
      document.querySelector('.love__img').classList.remove('animationOp');
      document.querySelector('#mewmew').classList.remove('animationOp');
      document.querySelectorAll('.heart').forEach(h=>h.classList.remove('animation'));
      $('.box__letter').slideUp(); $('.letter__border').slideUp();
    });
  </script>

</body>
</html>
